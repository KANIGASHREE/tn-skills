{% extends "base.html" %}

{% block title %}
Login
{% endblock %}


{% block content %}

<div class="auth card">

    <h1>
        Welcome back
    </h1>

    <form id="loginForm">

        <label>

            Email

            <input
                id="email"
                type="email"
                required
            >

        </label>


        <label>

            Password

            <input
                id="password"
                type="password"
                required
            >

        </label>


        <button class="btn">
            Login
        </button>


        <p
            id="msg"
            class="msg"
        ></p>

    </form>


    <p>
        New here?

        <a href="/register">
            Create an account
        </a>
    </p>

</div>

{% endblock %}


{% block scripts %}

<script>

document
    .querySelector("#loginForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const result = await api(
                "/token",
                {
                    method: "POST",

                    body: JSON.stringify({
                        email:
                            email.value,

                        password:
                            password.value
                    })
                }
            );

            if (result.access_token) {

                localStorage.token =
                    result.access_token;

                location.href =
                    "/dashboard";

            } else {

                msg.textContent =
                    result.detail ||
                    "Login failed.";

            }

        }
    );

</script>

{% endblock %}
